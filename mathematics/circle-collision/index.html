<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../style.css">
	<link rel="shortcut icon" href="https://hayattgd.github.io/img/favicon.png" type="image/x-icon">
	<title>Circle collision visualization</title>
	<script src="../../script.js"></script>
</head>

<body>
	<header><a id="back" href="../../index.html">back</a></header>
	<main>
		<p style="font-family: serif;" class="panel">Colliding = Distance &le; r<sub>1</sub> + r<sub>2</sub> = <span
				id="formula"></span> = <span id="result"></span></p>
		<div class="canvas-container panel">
			<canvas></canvas>
		</div>
		<p>
			Get distance from one circle's center to other circle's center.
			<br><samp class="formula">√(x₁ + x₂)² + (y₁ + y₂)² = d</samp>,
			this is usually <samp>(vec1 - vec2).magnitude</samp> in programming.
			<br>then, check if the value is greater than or equal to sum of it's radius.
			<br>if it is, then it is colliding.
		</p>
	</main>
	<script src="../../geometrylib.js"></script>
	<script src="script.js"></script>
</body>

</html>
